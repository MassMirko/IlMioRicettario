name: Pubblica ricetta approvata

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  pubblica:
    if: github.event.label.name == 'approvata'
    runs-on: ubuntu-latest

    steps:
      - name: Verifica approvazione amministratore
        if: github.actor != 'MassMirko'
        run: |
          echo "Solo l'amministratore MassMirko può approvare una ricetta."
          exit 1

      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai ricetta salva foto e aggiorna archivio
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          body = os.environ.get("ISSUE_BODY", "")
          issue_number = int(os.environ["ISSUE_NUMBER"])
          repository = os.environ["REPOSITORY"]

          def campo(nome, successivo=None):
              if successivo:
                  pattern = (
                      rf"### {re.escape(nome)}\s*\n(.*?)"
                      rf"(?=\n### {re.escape(successivo)}\s*\n)"
                  )
              else:
                  pattern = rf"### {re.escape(nome)}\s*\n(.*)"

              m = re.search(pattern, body, re.S)

              if not m:
                  return ""

              valore = m.group(1).strip()

              # GitHub usa questo testo nei campi facoltativi vuoti.
              if valore in ("_No response_", "No response"):
                  return ""

              return valore

          def estrai_foto(testo):
              if not testo:
                  return ""

              m = re.search(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  testo,
                  re.I
              )
              if m:
                  return m.group(1).strip()

              m = re.search(
                  r'!\[[^\]]*\]\((https?://[^)\s]+)\)',
                  testo,
                  re.I
              )
              if m:
                  return m.group(1).strip()

              m = re.search(
                  r'https?://github\.com/user-attachments/assets/[^\s<>"\']+',
                  testo,
                  re.I
              )
              if m:
                  return m.group(0).strip()

              return ""

          def estensione_immagine(dati):
              if dati.startswith(b"\xff\xd8\xff"):
                  return ".jpg"

              if dati.startswith(b"\x89PNG\r\n\x1a\n"):
                  return ".png"

              if dati.startswith(b"GIF87a") or dati.startswith(b"GIF89a"):
                  return ".gif"

              if (
                  len(dati) >= 12
                  and dati[0:4] == b"RIFF"
                  and dati[8:12] == b"WEBP"
              ):
                  return ".webp"

              return ""

          autore = campo(
              "Nome o nickname",
              "Nome della ricetta"
          )

          nome = campo(
              "Nome della ricetta",
              "Tipo di piatto"
          )

          tipo = campo(
              "Tipo di piatto",
              "Ingrediente principale"
          )

          ingrediente_principale = campo(
              "Ingrediente principale",
              "Regione"
          )

          regione = campo(
              "Regione",
              "Ingredienti"
          )

          ingredienti = campo(
              "Ingredienti",
              "Preparazione"
          )

          preparazione = campo(
              "Preparazione",
              "Tempo di preparazione"
          )

          tempo_preparazione = campo(
              "Tempo di preparazione",
              "Tempo di cottura"
          )

          tempo_cottura = campo(
              "Tempo di cottura",
              "Numero di persone"
          )

          persone = campo(
              "Numero di persone",
              "Difficoltà"
          )

          difficolta = campo(
              "Difficoltà",
              "Note e consigli"
          )

          note = campo(
              "Note e consigli",
              "Foto della ricetta"
          )

          foto = campo(
              "Foto della ricetta",
              "Conferma pubblicazione"
          )

          # Cerca prima la foto nel campo dedicato.
          # Se GitHub ha inserito l'allegato in un altro punto della Issue,
          # la cerca automaticamente nell'intero testo.
          foto_originale = estrai_foto(foto)

          if not foto_originale:
              foto_originale = estrai_foto(body)

          # La fotografia è obbligatoria per la Community. Non pubblicare mai
          # una ricetta monca: se manca un vero allegato GitHub, il job fallisce.
          if not foto_originale:
              raise SystemExit(
                  "ERRORE: fotografia mancante. Allega una fotografia valida "
                  "nel campo 'Foto della ricetta' prima dell'approvazione."
              )

          if not nome or not ingredienti or not preparazione:
              raise SystemExit(
                  "ERRORE: impossibile leggere i campi "
                  "obbligatori della ricetta."
              )

          percorso_json = "community/ricette.json"

          with open(percorso_json, "r", encoding="utf-8") as f:
              archivio = json.load(f)

          ricette = archivio.setdefault("ricette", [])

          if any(r.get("issue") == issue_number for r in ricette):
              print("Questa Issue risulta già pubblicata.")
              raise SystemExit(0)

          foto_url = ""
          foto_percorso = ""

          print("Foto allegata:", foto_originale)

          richiesta = urllib.request.Request(
              foto_originale,
              headers={
                  "User-Agent": "IlMioRicettario-GitHubAction",
                  "Accept": "image/*"
              }
          )

          # Qualunque errore di download o formato deve bloccare la pubblicazione.
          # Non esiste più il fallback che pubblicava comunque la ricetta senza foto.
          try:
              with urllib.request.urlopen(
                  richiesta,
                  timeout=30
              ) as risposta:
                  dati_foto = risposta.read()
          except Exception as errore:
              raise SystemExit(
                  f"ERRORE: impossibile scaricare la fotografia allegata: {errore}"
              )

          estensione = estensione_immagine(dati_foto)

          if not estensione:
              raise SystemExit(
                  "ERRORE: l'allegato non è un'immagine JPG, PNG, GIF o WEBP valida."
              )

          cartella_immagini = Path("community/immagini")
          cartella_immagini.mkdir(
              parents=True,
              exist_ok=True
          )

          nome_file = f"ricetta_{issue_number}{estensione}"
          destinazione = cartella_immagini / nome_file

          try:
              with open(destinazione, "wb") as f:
                  f.write(dati_foto)
          except Exception as errore:
              raise SystemExit(
                  f"ERRORE: impossibile salvare la fotografia nel repository: {errore}"
              )

          foto_percorso = f"community/immagini/{nome_file}"
          foto_url = (
              "https://raw.githubusercontent.com/"
              f"{repository}/main/{foto_percorso}"
          )

          print("Foto salvata nel repository:", foto_percorso)

          adesso = datetime.now(
              timezone.utc
          ).isoformat(timespec="seconds")

          nuova_ricetta = {
              "id": issue_number,
              "issue": issue_number,
              "nome": nome,
              "autore": autore,
              "tipo_piatto": tipo,
              "ingrediente_principale": ingrediente_principale,
              "regione": regione,
              "ingredienti": ingredienti,
              "preparazione": preparazione,
              "tempo_preparazione": tempo_preparazione,
              "tempo_cottura": tempo_cottura,
              "persone": persone,
              "difficolta": difficolta,
              "note": note,
              "foto_url": foto_url,
              "foto_originale": foto_originale,
              "foto_percorso": foto_percorso,
              "video_link": "",
              "data_pubblicazione": adesso
          }

          ricette.append(nuova_ricetta)

          archivio["ultimo_aggiornamento"] = adesso

          with open(percorso_json, "w", encoding="utf-8") as f:
              json.dump(
                  archivio,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Pubblicata:", nome)
          print("Regione:", regione if regione else "non specificata")

          PY

      - name: Rigenera pacchetto Android
        run: |
          python3 <<'PY'
          import hashlib, json, os, re, shutil, sqlite3, tempfile, zipfile
          from datetime import datetime
          from pathlib import Path

          archivio = json.loads(Path('community/ricette.json').read_text(encoding='utf-8'))
          community = archivio.get('ricette', [])
          sync = Path('sync')
          sync.mkdir(parents=True, exist_ok=True)
          vecchio_zip = sync / 'ricettario_dati.zip'

          with tempfile.TemporaryDirectory() as td:
              tmp = Path(td)
              if vecchio_zip.exists():
                  with zipfile.ZipFile(vecchio_zip, 'r') as z:
                      z.extractall(tmp)

              db = tmp / 'aggiornamento.db'
              foto_dir = tmp / 'immagini'
              foto_dir.mkdir(parents=True, exist_ok=True)
              con = sqlite3.connect(db)
              cur = con.cursor()
              cur.execute('''CREATE TABLE IF NOT EXISTS ricette (
                  id INTEGER PRIMARY KEY, nome TEXT NOT NULL, tipo_piatto TEXT,
                  ingrediente_principale TEXT, regione TEXT, foto TEXT, ingredienti TEXT,
                  preparazione TEXT, tempo_preparazione INTEGER, tempo_cottura INTEGER,
                  persone INTEGER, difficolta TEXT, note TEXT, video_link TEXT,
                  preferita INTEGER NOT NULL DEFAULT 0, community_id TEXT)''')
              cur.execute('PRAGMA table_info(ricette)')
              colonne = {r[1] for r in cur.fetchall()}
              if 'regione' not in colonne: cur.execute('ALTER TABLE ricette ADD COLUMN regione TEXT')
              if 'video_link' not in colonne: cur.execute('ALTER TABLE ricette ADD COLUMN video_link TEXT')
              if 'preferita' not in colonne: cur.execute('ALTER TABLE ricette ADD COLUMN preferita INTEGER NOT NULL DEFAULT 0')
              if 'community_id' not in colonne: cur.execute('ALTER TABLE ricette ADD COLUMN community_id TEXT')

              cur.execute('SELECT id, nome, community_id FROM ricette')
              righe = cur.fetchall()
              per_cid = {str(cid).strip(): rid for rid, _, cid in righe if cid is not None and str(cid).strip()}
              per_nome = {' '.join(str(nome or '').split()).casefold(): (rid, str(cid or '').strip()) for rid, nome, cid in righe if str(nome or '').strip()}

              def numero(v):
                  m = re.search(r'-?\d+', str(v or '').strip())
                  return int(m.group(0)) if m else None

              for r in community:
                  nome = str(r.get('nome') or '').strip()
                  cid = str(r.get('id') or '').strip()
                  if not nome or not cid:
                      continue
                  foto_rel = str(r.get('foto_percorso') or '').strip()
                  foto_db = ''
                  if foto_rel:
                      origine = Path(foto_rel)
                      if not origine.is_file():
                          raise SystemExit(f'ERRORE: foto mancante per {nome}: {foto_rel}')
                      shutil.copy2(origine, foto_dir / origine.name)
                      foto_db = 'immagini/' + origine.name

                  valori = (nome, str(r.get('tipo_piatto') or '').strip(),
                      str(r.get('ingrediente_principale') or '').strip(),
                      str(r.get('regione') or '').strip(), foto_db,
                      str(r.get('ingredienti') or '').strip(), str(r.get('preparazione') or '').strip(),
                      numero(r.get('tempo_preparazione')), numero(r.get('tempo_cottura')), numero(r.get('persone')),
                      str(r.get('difficolta') or '').strip(), str(r.get('note') or '').strip(),
                      str(r.get('video_link') or '').strip(), cid)

                  if cid in per_cid:
                      cur.execute('''UPDATE ricette SET nome=?, tipo_piatto=?, ingrediente_principale=?, regione=?,
                          foto=?, ingredienti=?, preparazione=?, tempo_preparazione=?, tempo_cottura=?, persone=?,
                          difficolta=?, note=?, video_link=?, community_id=? WHERE id=?''', valori + (per_cid[cid],))
                      continue

                  chiave = ' '.join(nome.split()).casefold()
                  if chiave in per_nome and not per_nome[chiave][1]:
                      rid = per_nome[chiave][0]
                      cur.execute('UPDATE ricette SET community_id=? WHERE id=?', (cid, rid))
                      per_cid[cid] = rid
                      continue

                  cur.execute('''INSERT INTO ricette (nome,tipo_piatto,ingrediente_principale,regione,foto,ingredienti,
                      preparazione,tempo_preparazione,tempo_cottura,persone,difficolta,note,video_link,preferita,community_id)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,0,?)''', valori)
                  per_cid[cid] = cur.lastrowid

              con.commit()
              cur.execute('SELECT COUNT(*) FROM ricette')
              recipe_count = cur.fetchone()[0]
              con.close()
              image_count = sum(1 for p in foto_dir.iterdir() if p.is_file())

              h = hashlib.sha256(db.read_bytes()).hexdigest()
              versione = f'1.5.{recipe_count}'
              manifest = {'schema':1,'data_version':versione,'created_at':datetime.now().astimezone().isoformat(timespec='seconds'),
                  'recipe_count':recipe_count,'image_count':image_count,'database_file':'aggiornamento.db',
                  'database_sha256':h,'images_dir':'immagini'}
              (tmp/'versione_aggiornamento.txt').write_text(versione, encoding='utf-8')
              (tmp/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

              nuovo = sync/'ricettario_dati.zip.nuovo'
              with zipfile.ZipFile(nuovo, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(db, 'aggiornamento.db')
                  z.write(tmp/'versione_aggiornamento.txt', 'versione_aggiornamento.txt')
                  z.write(tmp/'manifest.json', 'manifest.json')
                  for f in sorted(foto_dir.iterdir()):
                      if f.is_file(): z.write(f, 'immagini/' + f.name)
              os.replace(nuovo, sync/'ricettario_dati.zip')
              shutil.copy2(tmp/'manifest.json', sync/'manifest.json')
              print(f'Pacchetto Android: {recipe_count} ricette, {image_count} immagini, {versione}')
          PY

      - name: Pubblica modifica nel repository
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add community/ricette.json
            git add community/immagini 2>/dev/null || true
            git add sync/manifest.json
            git add sync/ricettario_dati.zip

            git commit -m "Pubblica ricetta #${{ github.event.issue.number }} e aggiorna pacchetto Android"
            git push
          else
            echo "Nessuna modifica da pubblicare."
          fi

      - name: Aggiorna e chiudi la richiesta
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: 'ricetta-da-approvare'
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '✅ Ricetta approvata e pubblicata nella Community di **Il Mio Ricettario**.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed'
            });
