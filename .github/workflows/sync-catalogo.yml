name: Sincronizzazione catalogo unificato

on:
  workflow_dispatch:
    inputs:
      applica_sul_test:
        description: "Applica aggiornamenti soltanto a Cloudflare TEST (false = sola lettura)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: sync-catalogo-unificato
  cancel-in-progress: false

jobs:
  sincronizza-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizza lo ZIP Windows con il catalogo D1 TEST
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DATABASE_ID: f1fc18be-82ea-446a-911d-06b9a9f78b2e
          GH_TOKEN: ${{ github.token }}
          SYNC_APPLY: ${{ inputs.applica_sul_test }}
        run: python3 scripts/sync_catalogo.py
