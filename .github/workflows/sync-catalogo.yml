name: Sincronizzazione catalogo unificato

on:
  push:
    branches: [main]
    paths:
      - 'sync/ricettario_dati.zip'
      - 'sync/manifest.json'
  workflow_dispatch:
    inputs:
      destinazione:
        description: "Database di destinazione"
        type: choice
        required: true
        options:
          - TEST
          - PRODUZIONE
        default: TEST
      applica:
        description: "Applica aggiornamenti (false = sola lettura)"
        type: boolean
        required: true
        default: false
      conferma_produzione:
        description: "Per scrivere in PRODUZIONE digitare CONFERMO_PRODUZIONE"
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-catalogo-unificato
  cancel-in-progress: false

jobs:
  sincronizza-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizza lo ZIP Windows con il catalogo D1 TEST
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DATABASE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.destinazione == 'PRODUZIONE' && 'b22d8825-9259-4cce-92f5-8124fe6f8c7a' || 'f1fc18be-82ea-446a-911d-06b9a9f78b2e' }}
          GH_TOKEN: ${{ github.token }}
          SYNC_APPLY: ${{ github.event_name == 'push' && 'true' || inputs.applica }}
          SYNC_PRODUCTION_CONFIRM: ${{ inputs.conferma_produzione }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/sync_catalogo.py

      - name: Sincronizza PRODUZIONE dopo TEST riuscito
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DATABASE_ID: b22d8825-9259-4cce-92f5-8124fe6f8c7a
          GH_TOKEN: ${{ github.token }}
          SYNC_APPLY: 'true'
          SYNC_PRODUCTION_CONFIRM: CONFERMO_PRODUZIONE
          SYNC_AUTO_AFTER_TEST: 'true'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/sync_catalogo.py
