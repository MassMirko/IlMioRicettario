name: "🍴 Pubblica una ricetta"
description: "Invia una ricetta a Il Mio Ricettario per l'approvazione"
title: "[RICETTA] "
labels:
  - "ricetta-da-approvare"

body:
  - type: markdown
    attributes:
      value: |
        ## 🍴 IL MIO RICETTARIO

        Proponi una ricetta per la Community.

        La ricetta sarà pubblicata solamente dopo
        l'approvazione dell'amministratore.

  - type: input
    id: autore
    attributes:
      label: "Nome o nickname"
      placeholder: "Es. Mirko"
    validations:
      required: true

  - type: input
    id: nome
    attributes:
      label: "Nome della ricetta"
      placeholder: "Es. Spaghetti alle vongole"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo di piatto"
      options:
        - Antipasti
        - Primi
        - Secondi
        - Contorni
        - Dolci
        - Altro
    validations:
      required: true

  - type: input
    id: ingrediente_principale
    attributes:
      label: "Ingrediente principale"
      placeholder: "Es. Pasta"

  - type: input
    id: regione
    attributes:
      label: "Regione"
      description: "Campo facoltativo"
      placeholder: "Es. Sardegna, Marche, Lombardia"

  - type: textarea
    id: ingredienti
    attributes:
      label: "Ingredienti"
      placeholder: "Inserisci gli ingredienti..."
    validations:
      required: true

  - type: textarea
    id: preparazione
    attributes:
      label: "Preparazione"
      placeholder: "Descrivi la preparazione..."
    validations:
      required: true

  - type: input
    id: tempo_preparazione
    attributes:
      label: "Tempo di preparazione"
      description: "Campo facoltativo - indicare i minuti"
      placeholder: "Es. 15"

  - type: input
    id: tempo_cottura
    attributes:
      label: "Tempo di cottura"
      description: "Campo facoltativo - indicare i minuti"
      placeholder: "Es. 30"

  - type: input
    id: persone
    attributes:
      label: "Numero di persone"
      description: "Campo facoltativo"
      placeholder: "Es. 2"

  - type: dropdown
    id: difficolta
    attributes:
      label: "Difficoltà"
      options:
        - Facile
        - Media
        - Difficile

  - type: textarea
    id: note
    attributes:
      label: "Note e consigli"
      placeholder: "Eventuali note o consigli..."

  - type: textarea
    id: foto
    attributes:
      label: "Foto della ricetta"
      description: "Campo facoltativo - trascina qui una fotografia oppure incollala nel riquadro."
      placeholder: "Trascina qui la fotografia..."

  - type: checkboxes
    id: conferma
    attributes:
      label: "Conferma pubblicazione"
      options:
        - label: "Confermo di voler proporre questa ricetta per la pubblicazione nella Community."
          required: true
