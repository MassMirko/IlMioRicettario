name: "🍴 Pubblica una ricetta"
description: "Invia una ricetta a Il Mio Ricettario per l'approvazione"
title: "[RICETTA] "
labels:
  - "ricetta-da-approvare"

body:
  - type: markdown
    attributes:
      value: |
        ## 🍴 IL MIO RICETTARIO

        Proponi una ricetta per la Community.

        La ricetta sarà pubblicata solamente dopo
        l'approvazione dell'amministratore.

  - type: input
    id: autore
    attributes:
      label: "Nome o nickname"
      placeholder: "Es. Mirko"
    validations:
      required: true

  - type: input
    id: nome
    attributes:
      label: "Nome della ricetta"
      placeholder: "Es. Spaghetti alle vongole"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo di piatto"
      options:
        - Antipasti
        - Primi
        - Secondi
        - Contorni
        - Piatti unici
        - Dolci
        - Altro
    validations:
      required: true

  - type: input
    id: ingrediente_principale
    attributes:
      label: "Ingrediente principale"
      placeholder: "Es. Pasta"

  - type: textarea
    id: ingredienti
    attributes:
      label: "Ingredienti"
      placeholder: |
        Es.
        200 g spaghetti
        500 g vongole
        1 spicchio d'aglio
        Olio extravergine d'oliva
    validations:
      required: true

  - type: textarea
    id: preparazione
    attributes:
      label: "Preparazione"
      placeholder: "Descrivi tutti i passaggi della preparazione..."
    validations:
      required: true

  - type: input
    id: tempo_preparazione
    attributes:
      label: "Tempo di preparazione"
      placeholder: "Es. 15 minuti"

  - type: input
    id: tempo_cottura
    attributes:
      label: "Tempo di cottura"
      placeholder: "Es. 20 minuti"

  - type: input
    id: persone
    attributes:
      label: "Numero di persone"
      placeholder: "Es. 2"

  - type: dropdown
    id: difficolta
    attributes:
      label: "Difficoltà"
      options:
        - Facile
        - Media
        - Difficile

  - type: textarea
    id: note
    attributes:
      label: "Note e consigli"
      placeholder: "Eventuali note, varianti o consigli..."

  - type: checkboxes
    id: conferma
    attributes:
      label: "Conferma pubblicazione"
      description: "La ricetta sarà sottoposta all'approvazione dell'amministratore."
      options:
        - label: "Confermo di voler proporre questa ricetta per la pubblicazione nella Community."
          required: true
